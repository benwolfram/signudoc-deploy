name: Build image

# Bump VERSION to an upstream release tag and push: CI builds and pushes
# ghcr.io/<owner>/signudoc:<tag> and :latest.
on:
  push:
    branches: [main]
    paths: [VERSION, Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: SIGNUDOC_VERSION=${{ steps.v.outputs.tag }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/signudoc:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/signudoc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
